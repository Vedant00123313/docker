name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.dev -t testimage .

      - name: Run tests
        run: docker run --rm testimage npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr
        run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u "${{github.actor}}" --password-stdin

      - name: Build Production image
        run: docker build -t ghcr.io/vedant00123313/docker:latest .

      - name: Push image to ghcr
        run: docker push ghcr.io/vedant00123313/docker:latest

      - name: Notify render using webhook
        run: curl -X POST "${{secrets.DEPLOY_HOOK}}"
