name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.dev -t testimage .

      - name: Run tests
        run: docker run --rm testimage npm test
