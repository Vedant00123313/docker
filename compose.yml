services:
  app_service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: appci:1.0
    container_name: app
    ports:
      - 5173:5173
    volumes:
      - .:/home/app
      - /home/app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

  tests:
    image: appci:1.0
    command: npm test
    container_name: app_tests
